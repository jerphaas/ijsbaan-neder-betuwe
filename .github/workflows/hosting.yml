name: Publiceer op ijsbaannederbetuwe.nl

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'server/**'
      - 'scripts/**'
      - 'deploy.json'
      - '.github/workflows/hosting.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ijsbaan-production-hosting
  cancel-in-progress: false

jobs:
  publish:
    if: vars.IJSBAAN_AUTO_DEPLOY == 'true' && github.repository == 'jerphaas/ijsbaan-neder-betuwe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://ijsbaannederbetuwe.nl/
    steps:
      - name: Haal de gecommitte website op
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Controleer versie, publicatiescript en inhoud
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          python -m unittest discover -s tests -p 'test_deployment.py'
          python scripts/check_seo.py
          node scripts/update_sponsor_catalog.mjs --check
          find dist server -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Publiceer via gecontroleerde FTPS met afgeschermde back-up
        env:
          IJSBAAN_FTP_PASSWORD: ${{ secrets.IJSBAAN_FTP_PASSWORD }}
          IJSBAAN_MAINTENANCE_KEY: ${{ secrets.IJSBAAN_MAINTENANCE_KEY }}
          IJSBAAN_CONFIG_SHA256: ${{ secrets.IJSBAAN_CONFIG_SHA256 }}
        run: python -u scripts/publish.py --publish
      - name: Controleer de live versie, SEO en redirects
        run: python scripts/check_seo.py --live
      - name: Publicatieresultaat
        if: success()
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          printf '### Website gepubliceerd\n\nhttps://ijsbaannederbetuwe.nl/\n\nCommit: `%s`\n\nFTPS, afgeschermde back-up, backend, publieke bestanden en live SEO gecontroleerd.\n' "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
