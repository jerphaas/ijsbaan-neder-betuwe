name: Publiceer website op GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Controleer SEO en crawlbare inhoud
        run: |
          python scripts/check_seo.py
          node scripts/update_sponsor_catalog.mjs --check
      - name: Maak statische kopie zonder PHP
        run: |
          mkdir pages-dist
          rsync -a --exclude='api/' --exclude='beheer/' dist/ pages-dist/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
